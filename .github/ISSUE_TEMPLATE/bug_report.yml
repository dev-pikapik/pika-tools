name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: macos
    attributes:
      label: macOS version
      description: Apple menu → About This Mac.
      options:
        - macOS 27
        - macOS 26 Tahoe
        - macOS 15 Sequoia
        - macOS 14 Sonoma
        - Other
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: pikapik version
      description: Shown at the bottom of the menu. Not sure? Leave “Latest version”.
      default: 0
      options:
        - Latest version
        - "1.27.3"
        - "1.27.2"
        - "1.27.1"
        - "1.27.0"
        - "1.26.2"
        - "1.26.1"
        - "1.26.0"
        - "1.25.2"
        - "1.25.1"
        - "1.25.0"
        - "1.24.1"
        - "1.24.0"
        - "1.23.2"
        - "1.23.1"
        - "1.23.0"
        - "1.22.0"
        - "1.21.0"
        - "1.20.0"
        - "1.19.0"
        - "1.18.2"
        - "1.18.1"
        - "1.18.0"
        - "1.17.1"
        - "1.17.0"
        - "1.16.0"
        - "1.15.2"
        - "1.15.1"
        - "1.15.0"
        - "1.14.1"
        - "1.14.0"
        - "1.13.0"
        - "1.12.0"
        - "1.11.0"
        - "1.10.1"
        - "1.10.0"
        - "1.9.0"
        - "1.8.0"
        - "1.7.0"
        - "1.6.0"
        - "1.5.2"
        - "1.5.1"
        - "1.5.0"
        - "1.4.1"
        - "1.4.0"
        - "1.3.0"
        - "1.2.1"
        - "1.2.0"
        - "1.1.0"
        - "1.0.2"
        - "1.0.1"
        - "1.0.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on Block Ctrl shortcuts
        2. Press Ctrl+Space
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
