name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pikapik version
      description: Shown at the bottom of the menu.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on Block Ctrl shortcuts
        2. Press Ctrl+Space
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
