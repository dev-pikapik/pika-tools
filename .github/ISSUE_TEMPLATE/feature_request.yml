        - "Install and uninstall › Homebrew"
        - "Install and uninstall › Uninstall"
        # features:end
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Where did you get pikapik?
      description: The Mac App Store, or a download from the website, GitHub or Homebrew.
      options:
        - Mac App Store
        - Website / GitHub / Homebrew
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What gets in your way?
      description: Describe the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
  - type: dropdown
    id: macos
    attributes:
      label: macOS version
      options:
        - macOS 27
        - macOS 26 Tahoe
        - macOS 15 Sequoia
        - macOS 14 Sonoma
        - Other
