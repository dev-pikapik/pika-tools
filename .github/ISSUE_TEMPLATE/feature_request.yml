        - "Finder › Show hidden files"
        - "Finder › Restart Finder"
        - "Animations › Animation speed"
        - "Animations › Hide the Dock automatically"
        - "Animations › Fine-tuning"
        - "Animations › Minimize effect"
        - "Animations › Bouncing icons"
        - "Animations › Even calmer: Reduce Motion in Accessibility"
