name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  direct:
    name: Direct
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          xcodebuild -version
          ./scripts/build.sh

  appstore:
    name: App Store
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: APPSTORE=1 ./scripts/build.sh

  tests:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Run the tests from CONTRIBUTING.md
        run: |
          mkdir -p build
          ./scripts/fetch-7zip.sh
          grep '^swiftc .*scripts/test-' CONTRIBUTING.md | grep -v test-fan-helper | while IFS= read -r test; do
            echo "${test##*&& build/}"
            bash -c "$test" < /dev/null
          done
